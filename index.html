<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treinamento SDR/BDR - Fluxo de Leads e OPs</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', Arial, sans-serif;
}

body{
    background:#f5f7fa;
    color:#333;
    line-height:1.6;
}

header{
    background:#0f4c81;
    color:white;
    padding:30px;
}

header h1{
    font-size:32px;
}

header p{
    margin-top:10px;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:30px;
}

.card{
    background:white;
    padding:25px;
    margin-bottom:20px;
    border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.card h2{
    color:#0f4c81;
    margin-bottom:15px;
}

.fluxo{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
}

.etapa{
    background:#0f4c81;
    color:white;
    padding:15px;
    border-radius:8px;
    min-width:150px;
    text-align:center;
    font-weight:bold;
}

.arrow{
    font-size:24px;
    color:#0f4c81;
    display:flex;
    align-items:center;
}

.alerta{
    background:#fff4e5;
    border-left:6px solid #ff9800;
    padding:15px;
    margin-top:15px;
}

.regra{
    background:#e8f5e9;
    border-left:6px solid #4caf50;
    padding:15px;
    margin-top:15px;
}

.erro{
    background:#fdecea;
    border-left:6px solid #f44336;
    padding:15px;
    margin-top:15px;
}

ul{
    margin-left:20px;
}

.quiz{
    margin-top:20px;
}

.pergunta{
    margin-bottom:25px;
}

button{
    background:#0f4c81;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#09365b;
}

.resultado{
    margin-top:20px;
    padding:15px;
    font-weight:bold;
}

footer{
    background:#0f4c81;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:40px;
}

@media(max-width:768px){
    .fluxo{
        flex-direction:column;
    }
    .arrow{
        transform:rotate(90deg);
        justify-content:center;
    }
}
</style>
</head>

<body>

<h1>Treinamento SDR/BDR</h1>
<p>Fluxo de Leads, Conversão e Geração de Oportunidades (OP)</p>
</header>
